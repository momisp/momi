<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>游戏活动时间轴</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--m:#8b949e;--t:#f0f6fc;--a:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
header{padding:26px clamp(14px,3.8vw,40px) 16px;border-bottom:1px solid var(--bd);background:radial-gradient(1000px 360px at 14% -20%,rgba(88,166,255,.13),transparent 60%)}
h1{margin:0 0 8px;font-size:clamp(22px,3.6vw,30px)}
p.sub{margin:0;color:var(--m);max-width:72ch}
main{padding:16px clamp(14px,3.8vw,40px) 48px;max-width:1040px;margin:0 auto}
section.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.chk{display:inline-flex;gap:8px;padding:6px 10px;border:1px solid var(--bd);border-radius:999px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--a)}
button{background:#21262d;border:1px solid var(--bd);color:var(--t);padding:8px 14px;border-radius:10px;font-weight:650;cursor:pointer}
button.secondary{font-weight:500}
button:hover{border-color:#58a6ff88}
input[type=text],textarea{width:100%;background:#10161f;border:1px solid var(--bd);color:var(--t);padding:8px;border-radius:8px}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
#status{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px dashed var(--bd);color:var(--m);font-size:14px}
#status[data-k=ok]{border-color:#238636;color:#c9d1d9}
#status[data-k=warn]{border-color:#d29922}
#status[data-k=err]{border-color:#f85149}
#status b{color:var(--t)}
.day{margin:16px 0 8px;font-weight:650;font-size:14px;color:var(--m)}
.events{list-style:none;margin:0;padding:0}
.card{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#121821}
.bad{display:flex;gap:10px;align-items:center;color:var(--m);font-size:12px;margin-bottom:8px}
.dot{width:8px;height:8px;background:var(--a);border-radius:999px}
.card h3{margin:0 0 8px;font-size:15px;line-height:1.35;font-weight:700}
.meta{font-size:13px;color:var(--m)}
.note{margin-top:8px;font-size:12px;color:var(--m)}
.link{display:inline-block;margin-top:10px;color:var(--a)}
details summary{cursor:pointer;color:var(--m)}
details summary::marker{font-size:.9em}
.empty{padding:20px;text-align:center;border:1px dashed var(--bd);border-radius:12px;color:var(--m)}
</style>
</head>

<body>

<header>
  <h1>游戏活动时间轴</h1>
  <p class="sub">
    「绝区零 / 原神 / 崩坏3 / 崩坏：星穹铁道 / 明日方舟」的公告候选池 + 正则筛选活动时间相关条目。
    <br />纯浏览器抓取 + LocalStorage；受跨域（CORS）限制时可勾选下方的公共转发代理演示入口。
  </p>
</header>

<main>
  <section class="panel">
    <h2>控制台</h2>
    <div class="row">
      <button type="button" id="btnGrab">抓取最新公告并入本地缓存</button>
      <button type="button" class="secondary" id="btnWipe">清空缓存</button>
      <label class="chk"><input type="checkbox" id="dailyAuto" checked />北京时间每日首次访问自动静默抓取一次</label>
      <label class="chk"><input type="checkbox" id="viaProxy" />跨域时使用公共抓取代理 api.allorigins.win（不稳定）</label>
    </div>

    <div class="row" style="margin-top:12px">
      <small style="color:var(--m)">选择展示的游戏：</small>
      <label class="chk"><input class="g" type="checkbox" value="zzz" checked />绝区零</label>
      <label class="chk"><input class="g" type="checkbox" value="ys" checked />原神</label>
      <label class="chk"><input class="g" type="checkbox" value="bh3" checked />崩坏3</label>
      <label class="chk"><input class="g" type="checkbox" value="sr" checked />崩铁</label>
      <label class="chk"><input class="g" type="checkbox" value="ak" checked />明日方舟</label>
    </div>

    <label class="note" style="display:block;margin-top:10px;font-size:13px;color:var(--t)">
      活动相关关键字（正则，匹配标题子串）
      <input style="margin-top:6px" id="rex" autocomplete="off" spellcheck="false" />
    </label>

    <div id="status">状态：<b>就绪</b>——点击抓取开始。</div>
    <div class="note">说明：正则会在浏览器端对已缓存的原始条目再过滤——你可以随时调整关键字不重抓网络。</div>
  </section>

  <section class="panel">
    <h2 id="tlHdr">活动时间轴（按发布时间分日）</h2>
    <div id="tl"></div>
  </section>

  <section class="panel">
    <details>
      <summary><b style="color:var(--t)">数据源配置（仅存 JSON，不含脚本函数）</b></summary>
      <p class="note">如需修改 channelId / 备用域名数组，可自行编辑后保存。默认带两条备选 URL（HoYoverse 与 Mihoyo CDN）。</p>
      <textarea id="cfgTa"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="secondary" type="button" id="cfgReset">恢复出厂</button>
        <button type="button" id="cfgSave">保存</button>
      </div>
    </details>
  </section>
</main>

<script>

(function(){
  "use strict";

  /** Storage keys **/

  var K = {
    raw: "ga_timeline_raw_v10",
    last: "ga_timeline_last_iso_v10",
    dailyStamp: "ga_timeline_daily_key_v10",
    autoOn: "ga_timeline_auto_on_v10",
    cfgOverlay: "ga_timeline_cfg_overlay_v10"
  };

  var DEFAULT_CFG = {
    regexDefault:
      "\\u6d3b\\u52a8|\\u5bfb\\u8bbf|\\u9650\\u5b9a|\\u9650\\u65f6|\\u53cc\\u500d|\\u62db\\u52df|\\u5f00\\u653e|\\u671f|\\u8ddf\\u8e2a|UP|\\u7948\\u613f|\\u9632\\u7a7a|\\u9632\\u7a7a\\u9632|\\u9884\\u7ea6",
    proxyPrefix: "https://api.allorigins.win/raw?url=",
    games: [
      { key: "zzz", label: "绝区零", feeds: [
          { kind: "mh", url: "https://content-static.hoyoverse.com/content/napCn/getContentList?pageSize=40&pageNum=1&channelId=47" },
          { kind: "mh", url: "https://content-static.mihoyo.com/content/napCn/getContentList?pageSize=40&pageNum=1&channelId=47" }
        ] },
      { key: "ys", label: "原神", feeds: [
          { kind: "mh", url: "https://content-static.hoyoverse.com/content/ysCn/getContentList?pageSize=40&pageNum=1&channelId=12" },
          { kind: "mh", url: "https://content-static.mihoyo.com/content/ysCn/getContentList?pageSize=40&pageNum=1&channelId=12" }
        ] },
      { key: "bh3", label: "崩坏3", feeds: [
          { kind: "mh", url: "https://content-static.hoyoverse.com/content/bh3Cn/getContentList?pageSize=40&pageNum=1&channelId=12" },
          { kind: "mh", url: "https://content-static.mihoyo.com/content/bh3Cn/getContentList?pageSize=40&pageNum=1&channelId=12" }
        ] },
      { key: "sr", label: "崩坏：星穹铁道", feeds: [
          { kind: "mh", url: "https://content-static.hoyoverse.com/content/hkrpgCn/getContentList?pageSize=40&pageNum=1&channelId=12" },
          { kind: "mh", url: "https://content-static.mihoyo.com/content/hkrpgCn/getContentList?pageSize=40&pageNum=1&channelId=12" }
        ] },
      { key: "ak", label: "明日方舟", feeds: [
          { kind: "akmeta", url: "https://ak-fs.hypergryph.com/announce/Android/announcement.meta.json" },
          { kind: "akmeta", url: "https://ak-fs.hypergryph.com/announce/IOS/announcement.meta.json" }
        ] }
    ]
  };

  /** helpers **/

  function $(id){ return document.getElementById(id); }

  function zhNowStr(d){ return fmtCN(d||new Date()); }

  function fmtCN(dt){
    return new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(dt).replace(",","");
  }

  function dayKeyCn(){ return zhNowStr().slice(0,10); }

  function escHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;"); }

  function canonKey(k){ return String(k||"").toLowerCase().replace(/\s+/g,""); }

  function uniqPush(dst, chunk){
    var seen={}, i, k, out=dst.slice();
    for(i=0;i<out.length;i++) seen[out[i].uniq||canonKey((out[i].gk||'')+'|'+(out[i].title||''))]=true;
    for(i=0;i<chunk.length;i++){
      var u=chunk[i].uniq||(canonKey((chunk[i].gk||'')+'|'+(chunk[i].title||'')));
      if(seen[u]) continue; seen[u]=true; chunk[i].uniq=u; out.push(chunk[i]);
    }
    return out;
  }

  function loadOverlayCfg(){
    try{ return JSON.parse(localStorage.getItem(K.cfgOverlay)||"null")||{}; }catch(e){ return {}; }
  }

  /** merge **/

  function activeCfg(){
    var ovr=loadOverlayCfg();
    var base=JSON.parse(JSON.stringify(DEFAULT_CFG));
    if(ovr.regexDefault) base.regexDefault=String(ovr.regexDefault);
    if(ovr.proxyPrefix) base.proxyPrefix=String(ovr.proxyPrefix);
    if(Array.isArray(ovr.games)&&ovr.games.length) base.games=ovr.games;
    return base;
  }

  /** persist textual cfg view **/

  function cfgTextFromActive(){
    var c=activeCfg();
    return JSON.stringify({regexDefault:c.regexDefault,proxyPrefix:c.proxyPrefix,games:c.games},null,2);
  }

  function saveCfgText(raw){
    var obj=JSON.parse(raw);
    var persist={};
    if(obj.regexDefault!=null) persist.regexDefault=obj.regexDefault;
    if(obj.proxyPrefix!=null) persist.proxyPrefix=obj.proxyPrefix;
    if(Array.isArray(obj.games)) persist.games=obj.games;
    localStorage.setItem(K.cfgOverlay,JSON.stringify(persist));
  }

  /** Regex **/

  function makeRx(txt){
    txt=String(txt||"").trim();
    var c=activeCfg();
    if(!txt) txt=c.regexDefault;
    try{
      /** non-empty pattern **/
      if(!txt.trim()) txt=".";
      return new RegExp(txt,"i");
    }catch(_e){ return /\u6d3b\u52a8|\u9650\u5b9a/; }

  }

  /** Time parse **/

  function parseMsMaybe(v){

    if(v==null||v==="")return null;

    if(typeof v==="number"){ var n=v; if(Math.abs(n)<1e11)n*=1000; return isFinite(n)?n:null;}

    /** ISO / epoch string **/

    var d=new Date(String(v));

    if(isFinite(d.valueOf()))return d.valueOf();

    var m=String(v).trim().replace("T"," ").match(/^(\d{4})-(\d{2})-(\d{2})(?:[ ](\d{2}):(\d{2})(?::(\d{2}))?)?/);
    if(!m)return null;

    var yy=+m[1],mo=+m[2],dd=+m[3],hh=m[4]?+m[4]:0,mi=m[5]?+m[5]:0,ss=m[6]?+m[6]:0;
    /** interpret naive field as CST (UTC+8) **/


    var utc=Date.UTC(yy,mo-1,dd,hh-8,mi,ss);
    var out=new Date(utc);
    return isFinite(out.valueOf())?out.valueOf():null;
  }
  /** mappers **/

  function mapMh(json,gk,gLabel){
        var lst=(json&&json.data&&json.data.list)||[];
          var rows=[],idx;
               for(idx=0;idx<lst.length;idx++){
                               var row=lst[idx]||{};
                               var ttl=String(row.title||row.subtitle||"").trim();
                                   if(!ttl)continue;
                                var ts=parseMsMaybe(row.publish_time||row.display_time||row.time||row.start_time||row.startTime||row.created_at);
                                var link="";
                                             var jmp=row.jump_url||row.jumpUrl||row.url;
                                               if(/^https?:/i.test(String(jmp)))link=String(jmp);
                                                           rows.push({gk:gk,gLabel:gLabel,title:ttl,t:ts,u:link,uniq:gk+"::"+ttl});
                                                                   }
                                                                     return rows;
                                                                       }
                                                                     function akStripHtml(s){

                                                                       return String(s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
                                                                         }
                                                                     function mapAk(json,gk,gLabel){
                                                                       var lst=[];
                                                                     if(Array.isArray(json&&json.announceList))lst=json.announceList;
                                                                           else if(json&&json.data&&Array.isArray(json.data.announceList))lst=json.data.announceList;
                                                                       var rows=[],i;
                                                                       for(i=0;i<lst.length;i++){
                                                                     var row=lst[i]||{};
                                                                     var ttl=String(row.title||"").trim();
                                                                           if(!ttl&&row.bodyHtml)ttl=akStripHtml(row.bodyHtml||row.content||"").slice(0,80);
                                                                                 if(!ttl)ttl=akStripHtml(JSON.stringify(row)).slice(0,60);
                                                                       var uid=String(row.unique_id||row.uniqueId||row.announce_id||row.id||"");
                                                                             var ts=parseMsMaybe(row.updatedAt||row.publishTime||row.time||row.startTime||(row.times&&row.times.start));
                                                                       var url=uid?"https://ak.hypergryph.com/news/"+encodeURIComponent(uid):"https://ak.hypergryph.com/news/";
                                                                     rows.push({gk:gk,gLabel:gLabel,title:ttl,t:ts,u:url,uniq:gk+"::"+uid+"::"+ttl});
                                                                     }
                                                                     return rows;
                                                                       }
                                                                     /** Fetch **/

                                                                     function grabUrl(realUrl,viaProxy,cfg){

                                                                       var u=String(realUrl);
                                                                       if(viaProxy){
                                                                     u=(cfg.proxyPrefix||DEFAULT_CFG.proxyPrefix)+encodeURIComponent(realUrl);
                                                                       }
                                                                     return fetch(u,{credentials:"omit",cache:"no-store"})
                                                                             .then(function(r){
                                                                       if(!r.ok)throw new Error("HTTP "+r.status);return r.text();
                                                                     })
                                                                             .then(function(t){
                                                                       try{return JSON.parse(t);}catch(parseErr){throw new Error("JSON parse failed");}
                                                                     });
                                                                       }
                                                                     /** crawler **/

                                                                     function crawlSequential(cfg,viaProxy,progress,done){

                                                                       var aggregated=[];

                                                                     var gi=-1;

                                                                     function advanceGame(){

                                                                       gi++; if(gi>=cfg.games.length){
                                                                             try{

                                                                                       done(null,aggregated);

                                                                                         }catch(e){ done(e,aggregated); }

                                                                                                   return;}

                                                                                                             var gm=cfg.games[gi]; var feeds=gm.feeds||[]; var fi=0;

                                                                                                             function bumpFeed(){

                                                                                                               if(fi>=feeds.length)return advanceGame();

                                                                         var fd=feeds[fi++];

                                                                     progress((gm.label||gm.key)+" → 数据源 "+Math.min(feeds.length,fi)+"/"+feeds.length);

                                                                     grabUrl(fd.url,viaProxy,cfg)

                                                                       .then(function(payload){

                                                                         var mapped=[];

                                                                     if(fd.kind==="mh") mapped=mapMh(payload,String(gm.key),String(gm.label||gm.key));

                                                                           else if(fd.kind==="akmeta") mapped=mapAk(payload,String(gm.key),String(gm.label||gm.key));

                                                                                 aggregated=uniqPush(aggregated,mapped); bumpFeed();

                                                                             })

                                                                     .catch(function(){ bumpFeed(); });

                                                                     }

                                                                     bumpFeed();

                                                                     }

                                                                     advanceGame();

                                                                       }
                                                                     /** view **/

                                                                     function loadCachedRaw(){
                                                                       try{return JSON.parse(localStorage.getItem(K.raw)||"[]");}catch(e){return[];}
                                                                     }
                                                                     function saveRaw(rows){

                                                                       rows.sort(function(a,b){ return (b.t||0)-(a.t||0); });

                                                                       localStorage.setItem(K.raw,JSON.stringify(rows));

                                                                       localStorage.setItem(K.last,(new Date()).toISOString());
                                                                     }
                                                                     function filterRows(rx, rows){

                                                                       var out=[];
                                                                           for(var i=0;i<rows.length;i++){
                                                                     if(rx.test(rows[i].title||""))out.push(rows[i]);
                                                                     }

                                                                       return out;
                                                                     }
                                                                     function render(rows){

                                                                       var host=$("tl"); host.innerHTML="";
                                                                     var allow={}; Array.prototype.slice.call(document.querySelectorAll(".g")).forEach(function(ch){

                                                                       allow[ch.value]=!!ch.checked;

                                                                     });
                                                                           rows=rows.filter(function(z){
                                                                     return !!allow[z.gk];
                                                                     });
                                                                           rows.sort(function(a,b){

                                                                       return(b.t||0)-(a.t||0); });
                                                                             if(rows.length===0){

                                                                               host.innerHTML="<div class='empty'><b style=color:var(--t)>暂无条目</b><div class='note'>请尝试抓取（或勾选代理）</div></div>";
                                                                         return;}
                                                                             var buckets={};
                                                                           rows.forEach(function(r){
                                                                     var dk=r.t&&isFinite(Number(r.t))?zhNowStr(new Date(+r.t)).slice(0,10):"unknown";
                                                                     buckets[dk]=buckets[dk]||[]; buckets[dk].push(r);
                                                                     });
                                                                     var days=Object.keys(buckets).sort().reverse();
                                                                           days.forEach(function(d){

                                                                               var dh=document.createElement("div");
                                                                           dh.className="day";
                                                                           dh.textContent=d==="unknown"?("时间暂未解析条目"):(d+"（北京时间日期）");
                                                                           host.appendChild(dh);
                                                                           var ul=document.createElement("ul");
                                                                           ul.className="events";
                                                                     buckets[d].sort(function(a,b){

                                                                       return(b.t||0)-(a.t||0);});
                                                                         buckets[d].forEach(function(ev){

                                                                               var li=document.createElement("li");
                                                                           var dv=document.createElement("div");
                                                                           dv.className="card";
                                                                           dv.innerHTML="<div class=bad><span class=dot></span><span>"+escHtml(ev.gLabel)+"</span></div><h3>"+escHtml(ev.title)+"</h3><div class=meta style=margin-top:6px>"+
                                                                                               "推断展示时间：<b style=color:#e6edf3>"+
                                                                                                               (ev.t?escHtml(fmtCN(new Date(ev.t))):"公告未附带可解析时间字段")+
                                                                                                               "</b></div>";
                                                                           if(ev.u){

                                                                               var a=document.createElement("a");
                                                                           a.href=ev.u;a.target="_blank";
                                                                           a.rel="noopener noreferrer";a.textContent="打开原文";
                                                                           a.className="link";
                                                                           dv.appendChild(a);
                                                                             }
                                                                     li.appendChild(dv);
                                                                           ul.appendChild(li);
                                                                         });
                                                                     host.appendChild(ul);
                                                                         });
                                                                           }
                                                                     /** UI **/

                                                                     function stashAutoFlag(){

                                                                       $("dailyAuto").checked?localStorage.setItem(K.autoOn,"1"):localStorage.setItem(K.autoOn,"0");
                                                                     }
                                                                     function readAutoFlag(){

                                                                       try{ return(localStorage.getItem(K.autoOn)||"1")==="1"; }catch(_e){ return true; }
                                                                     }
                                                                     function repaint(){
                                                                           var rex=makeRx($("rex").value);
                                                                           render(filterRows(rex,loadCachedRaw()));
                                                                           $("tlHdr").textContent="活动时间轴（按发布时间分日）";
                                                                           var lst=localStorage.getItem(K.last);
                                                                           if(lst){
                                                                     try{

                                                                                       $("tlHdr").textContent+=" · 最近一次缓存："+escHtml(fmtCN(new Date(lst)));}catch(__){}
                                                                     }
                                                                     }
                                                                     function setStat(kind,h){
                                                                       $("status").dataset.k=kind||"";
                                                                     $("status").innerHTML=h||"";
                                                                       }
                                                                     function runSilentAuto(cfg,via){

                                                                       crawlSequential(cfg,via,function(){
                                                                         },function(err,agg){

                                                                             if(err){

                                                                               setStat("warn","状态：<b>静默抓取失败</b>（脚本异常）。勾选代理后可手动抓取。");
                                                                                       return;}
                                                                                         saveRaw(agg||[]);
                                                                     localStorage.setItem(K.dailyStamp,dayKeyCn());
                                                                     repaint();
                                                                     setStat("ok","状态：<b>静默抓取已完成</b>——原始条目 <b>"+(agg?agg.length:0)+"</b> 条并入缓存。");
                                                                       });
                                                                     }
                                                                     function runInteractive(cfg,via){

                                                                       crawlSequential(cfg,via,function(txt){

                                                                     setStat("","状态：<b>抓取中</b>："+escHtml(String(txt))+"");
                                                                           },function(e,agg){

                                                                     if(e){
                                                                       setStat("err","状态：<b>抓取异常</b>："+escHtml(String(e&&(e.stack||e.message)||e)));
                                                                                       return;}
                                                                                         saveRaw(agg||[]);
                                                                           repaint();
                                                                           setStat("ok","状态：<b>抓取完成</b>——合并后缓存共 <b>"+(agg?agg.length:0)+"</b> 条。当前：<b>"+escHtml(fmtCN(new Date()))+"</b>");
                                                                     });
                                                                     }
                                                                     function maybeDaily(cfg){
                                                                       if(!$("dailyAuto").checked)return;
                                                                           var stampToday=dayKeyCn();
                                                                     var stamped=localStorage.getItem(K.dailyStamp)||"";
                                                                     if(stamped===stampToday)return;
                                                                           setStat("","状态：<b>检测到今日北京时间首次加载</b>，正在静默抓取...");
                                                                           runSilentAuto(cfg,!!$("viaProxy").checked);
                                                                     }
                                                                     /** boot **/

                                                                     function boot(){
                                                                       $("dailyAuto").checked=readAutoFlag();
                                                                     $("rex").value=activeCfg().regexDefault;
                                                                     $("cfgTa").value=cfgTextFromActive();
                                                                           repaint();
                                                                           var cfg=activeCfg();
                                                                           maybeDaily(cfg);
                                                                     $("btnGrab").addEventListener("click",function(){
                                                                     stashAutoFlag();
                                                                           runInteractive(activeCfg(),!!$("viaProxy").checked);
                                                                     });
                                                                     $("btnWipe").addEventListener("click",function(){

                                                                         localStorage.removeItem(K.raw);localStorage.removeItem(K.last);localStorage.removeItem(K.dailyStamp);
