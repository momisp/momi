<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目排期甘特图 · 多项目并排</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-active: #1e40af;
    --accent: #d97706;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e4e7ec;
    --border-light: #f0f1f3;
    --text: #111827;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --success: #059669;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 1360px; margin: 0 auto; padding: 28px 24px 48px; }

  header {
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  header p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    font-weight: 400;
  }

  .view-tabs {
    display: flex;
    gap: 2px;
    background: var(--border-light);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 3px;
  }
  .view-tabs button {
    border: none;
    background: transparent;
    padding: 7px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color .12s, background .12s;
  }
  .view-tabs button:hover { color: var(--text); }
  .view-tabs button:active { transform: scale(.98); }
  .view-tabs button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 640px) { .summary { grid-template-columns: repeat(2, 1fr); } }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  .card .num {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.2;
  }
  .card .lbl {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .field input, .field select {
    height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  .field input::placeholder { color: var(--text-muted); }
  .field input:hover, .field select:hover { border-color: #c9cdd4; }
  .field input:focus, .field select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
  }
  .field.name input { width: 148px; }
  .field.date input { width: 132px; }

  .toolbar-divider {
    width: 1px;
    height: 32px;
    background: var(--border);
    align-self: flex-end;
    margin: 0 2px;
  }

  .btn {
    height: 32px;
    padding: 0 14px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s, transform .08s;
    white-space: nowrap;
  }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-primary:active:not(:disabled) { background: var(--primary-active); }

  .btn-ghost {
    background: var(--surface);
    color: var(--text-secondary);
    border-color: var(--border);
  }
  .btn-ghost:hover:not(:disabled) { background: var(--bg); color: var(--text); border-color: #c9cdd4; }
  .btn-ghost:active:not(:disabled) { background: var(--border-light); }

  .btn-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: #fecaca;
    font-size: 12px;
    height: 26px;
    padding: 0 10px;
  }
  .btn-danger:hover:not(:disabled) { background: #fee2e2; border-color: #fca5a5; }

  .btn-sm {
    font-size: 12px;
    height: 26px;
    padding: 0 10px;
  }

  .error-msg {
    color: var(--danger);
    font-size: 12px;
    margin: -8px 0 12px;
    display: none;
    font-weight: 500;
  }
  .error-msg.show { display: block; }

  .status-bar {
    font-size: 13px;
    color: var(--text-secondary);
    background: #f0f6ff;
    border: 1px solid #dbeafe;
    border-left: 3px solid var(--primary);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    min-height: 40px;
    display: flex;
    align-items: center;
  }
  .status-bar.is-error {
    background: var(--danger-bg);
    border-color: #fecaca;
    border-left-color: var(--danger);
    color: var(--danger);
  }

  .legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .dot-line { width: 2px; height: 12px; border-radius: 1px; background: var(--accent); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .panel-scroll { overflow-x: auto; }

  .gantt-table { border-collapse: collapse; width: 100%; min-width: 640px; }
  .gantt-table th, .gantt-table td {
    border-bottom: 1px solid var(--border-light);
    font-size: 12px;
  }
  .gantt-table thead th {
    background: #fafbfc;
    color: var(--text-muted);
    font-weight: 500;
    padding: 10px 4px;
    text-align: center;
    white-space: nowrap;
    font-size: 11px;
  }
  .gantt-table thead th:first-child {
    text-align: left;
    padding-left: 16px;
    width: 200px;
    min-width: 200px;
    position: sticky;
    left: 0;
    z-index: 2;
    background: #fafbfc;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .gantt-table tbody td:first-child {
    padding: 10px 16px;
    font-weight: 500;
    font-size: 13px;
    position: sticky;
    left: 0;
    background: var(--surface);
    z-index: 1;
    border-right: 1px solid var(--border-light);
  }
  .gantt-table tbody tr:hover td { background: #fafbfc; }
  .gantt-table tbody tr:hover td:first-child { background: #f6f7f9; }

  .cell { width: 32px; min-width: 32px; height: 36px; padding: 0; position: relative; }
  .cell.weekend { background: #fafbfc; }
  .cell.today { background: #fffbeb; }

  .bar {
    position: absolute;
    top: 9px;
    height: 18px;
    border-radius: 4px;
    font-size: 11px;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 6px;
    white-space: nowrap;
    overflow: hidden;
    cursor: grab;
    z-index: 1;
    font-weight: 500;
  }
  .bar:active { cursor: grabbing; opacity: .85; }
  .bar.todo { background: #94a3b8; }
  .bar.doing { background: var(--primary); }
  .bar.done { background: var(--success); }
  .bar.overdue { background: var(--danger); }

  .today-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--accent);
    z-index: 2;
    pointer-events: none;
    opacity: .75;
  }

  .task-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .task-actions { display: flex; gap: 6px; margin-top: 6px; }

  .project-group td {
    background: #f6f7f9 !important;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    padding: 10px 16px !important;
    border-bottom: 1px solid var(--border) !important;
  }
  .project-tag {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    position: relative;
    top: -1px;
  }

  .empty {
    text-align: center;
    padding: 56px 24px;
    color: var(--text-muted);
  }
  .empty-icon { font-size: 32px; margin-bottom: 10px; opacity: .6; }
  .empty p { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
  .empty small { font-size: 12px; display: block; margin-top: 6px; color: var(--text-muted); }

  .multi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 16px;
  }
  .proj-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .proj-card-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .proj-card-head h2 {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .proj-card-head .badge {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .proj-card-body { overflow-x: auto; flex: 1; }

  .mini-table { border-collapse: collapse; width: 100%; min-width: 280px; }
  .mini-table th {
    background: #fafbfc;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 500;
    padding: 8px 2px;
    text-align: center;
  }
  .mini-table td {
    border-bottom: 1px solid var(--border-light);
    font-size: 12px;
    padding: 6px 4px;
    height: 32px;
    position: relative;
  }
  .mini-table td:first-child {
    width: 88px;
    max-width: 88px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-secondary);
    font-weight: 500;
    padding-left: 16px;
  }
  .mini-cell { width: 22px; min-width: 22px; padding: 0 !important; }
  .mini-cell.today { background: #fffbeb; }
  .mini-bar {
    position: absolute;
    top: 8px;
    height: 14px;
    border-radius: 3px;
    font-size: 0;
  }
  .proj-empty {
    padding: 36px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .hide { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>项目排期甘特图</h1>
      <p>单项目明细 · 多项目并排对比，一眼看清各线进度</p>
    </div>
    <div class="view-tabs">
      <button id="tabSingle" class="active">单项目视图</button>
      <button id="tabMulti">多项目并排</button>
    </div>
  </header>

  <div class="summary">
    <div class="card"><div class="num" id="statProjects">0</div><div class="lbl">项目数</div></div>
    <div class="card"><div class="num" id="statTotal">0</div><div class="lbl">总任务</div></div>
    <div class="card"><div class="num" id="statDoing">0</div><div class="lbl">进行中</div></div>
    <div class="card"><div class="num" id="statOverdue">0</div><div class="lbl">已逾期</div></div>
  </div>

  <div class="toolbar">
    <div class="field name"><label>项目名称</label><input type="text" id="projName" placeholder="例如：移动端 2.0" maxlength="20"></div>
    <button class="btn btn-ghost" id="addProjBtn">新建项目</button>
    <div class="toolbar-divider"></div>
    <div class="field"><label>所属项目</label><select id="taskProject"></select></div>
    <div class="field name"><label>任务名称</label><input type="text" id="taskName" placeholder="例如：接口联调" maxlength="30"></div>
    <div class="field date"><label>开始</label><input type="date" id="startDate"></div>
    <div class="field date"><label>结束</label><input type="date" id="endDate"></div>
    <div class="field"><label>状态</label>
      <select id="taskStatus"><option value="todo">未开始</option><option value="doing" selected>进行中</option><option value="done">已完成</option></select>
    </div>
    <button class="btn btn-primary" id="addTaskBtn">添加任务</button>
    <button class="btn btn-ghost" id="demoBtn">加载示例</button>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="status-bar" id="statusBar">就绪 · 先建项目再加任务，或点「加载示例」</div>

  <div class="legend">
    <span><i class="dot" style="background:#94a3b8"></i>未开始</span>
    <span><i class="dot" style="background:#2563eb"></i>进行中</span>
    <span><i class="dot" style="background:#059669"></i>已完成</span>
    <span><i class="dot" style="background:#dc2626"></i>已逾期</span>
    <span><i class="dot-line"></i>今天</span>
  </div>

  <div id="viewSingle" class="panel">
    <div class="panel-scroll"><div id="singleContent"><div class="empty"><div class="empty-icon">📅</div><p>暂无数据</p><small>新建项目并添加任务，或加载示例</small></div></div></div>
  </div>

  <div id="viewMulti" class="multi-grid hide"></div>
</div>

<script>
(function () {
  const DAY_W = 32, MINI_W = 22;
  const PCOLORS = ['#2563eb', '#7c3aed', '#db2777', '#d97706', '#059669', '#dc2626'];
  let projects = [];
  let tasks = [];
  let view = 'single';
  let drag = null;

  const $ = id => document.getElementById(id);
  const statusBar = $('statusBar');

  function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function fmtDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function diffDays(a, b) { return Math.round((b - a) / 86400000); }
  function isWeekend(d) { const w = d.getDay(); return w === 0 || w === 6; }

  function showError(msg) {
    $('errorMsg').textContent = msg;
    $('errorMsg').classList.add('show');
    statusBar.textContent = msg;
    statusBar.classList.add('is-error');
  }
  function setStatus(msg) {
    $('errorMsg').classList.remove('show');
    statusBar.classList.remove('is-error');
    statusBar.textContent = msg;
  }

  function projColor(i) { return PCOLORS[i % PCOLORS.length]; }
  function getProjectTasks(pid) { return tasks.filter(t => t.projectId === pid); }

  function getGlobalRange(taskList) {
    if (!taskList.length) { const t = today(); return { start: addDays(t, -3), end: addDays(t, 14) }; }
    let min = parseDate(taskList[0].start), max = parseDate(taskList[0].end);
    taskList.forEach(tk => { const s = parseDate(tk.start), e = parseDate(tk.end); if (s < min) min = s; if (e > max) max = e; });
    return { start: addDays(min, -2), end: addDays(max, 4) };
  }

  function barClass(tk) {
    if (tk.status !== 'done' && parseDate(tk.end) < today()) return 'overdue';
    return tk.status;
  }

  function barColor(bc) {
    return { overdue: '#dc2626', done: '#059669', doing: '#2563eb', todo: '#94a3b8' }[bc] || '#94a3b8';
  }

  function updateStats() {
    const td = today();
    $('statProjects').textContent = projects.length;
    $('statTotal').textContent = tasks.length;
    $('statDoing').textContent = tasks.filter(t => t.status === 'doing').length;
    $('statOverdue').textContent = tasks.filter(t => t.status !== 'done' && parseDate(t.end) < td).length;
  }

  function refreshProjectSelect() {
    const sel = $('taskProject');
    sel.innerHTML = projects.length
      ? projects.map(p => '<option value="' + p.id + '">' + p.name + '</option>').join('')
      : '<option value="">请先建项目</option>';
  }

  function renderSingle() {
    const el = $('singleContent');
    if (!projects.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">📅</div><p>暂无项目</p><small>点击「新建项目」开始</small></div>';
      return;
    }
    const range = getGlobalRange(tasks);
    const days = diffDays(range.start, range.end) + 1;
    const tdIdx = diffDays(range.start, today());

    let hdr = '<th>任务</th>';
    for (let i = 0; i < days; i++) {
      const d = addDays(range.start, i);
      const cls = [isWeekend(d) && 'weekend', i === tdIdx && 'today'].filter(Boolean).join(' ');
      hdr += '<th class="' + cls + '">' + (d.getMonth() + 1) + '/' + d.getDate() + '</th>';
    }

    let rows = '';
    projects.forEach((proj, pi) => {
      const pt = getProjectTasks(proj.id);
      const c = projColor(pi);
      rows += '<tr class="project-group"><td colspan="' + (days + 1) + '"><span class="project-tag" style="background:' + c + '"></span>' + proj.name + '<span style="color:var(--text-muted);font-weight:400;margin-left:6px">' + pt.length + ' 项</span><button class="btn btn-danger" style="float:right" onclick="delProject(\'' + proj.id + '\')">删项目</button></td></tr>';
      if (!pt.length) {
        rows += '<tr><td style="color:var(--text-muted);font-weight:400">暂无任务</td>';
        for (let i = 0; i < days; i++) rows += '<td class="cell"></td>';
        rows += '</tr>';
        return;
      }
      pt.forEach(tk => {
        const ts = parseDate(tk.start), te = parseDate(tk.end);
        const si = diffDays(range.start, ts), span = diffDays(ts, te) + 1;
        const bc = barClass(tk);
        const sl = { todo: '未开始', doing: '进行中', done: '已完成' }[tk.status];
        let cells = '';
        for (let i = 0; i < days; i++) {
          const d = addDays(range.start, i);
          const cls = ['cell', isWeekend(d) && 'weekend', i === tdIdx && 'today'].filter(Boolean).join(' ');
          let inner = '';
          if (i === si) inner = '<div class="bar ' + bc + '" data-id="' + tk.id + '" style="width:' + (span * DAY_W - 4) + 'px">' + tk.name + '</div>';
          if (i === tdIdx) inner += '<div class="today-line"></div>';
          cells += '<td class="' + cls + '">' + inner + '</td>';
        }
        const gIdx = tasks.indexOf(tk);
        rows += '<tr><td><div>' + tk.name + '</div><div class="task-meta">' + tk.start + ' ~ ' + tk.end + ' · ' + sl + '</div><div class="task-actions"><button class="btn btn-ghost btn-sm" onclick="cycleStatus(' + gIdx + ')">切换</button><button class="btn btn-danger" onclick="removeTask(' + gIdx + ')">删除</button></div></td>' + cells + '</tr>';
      });
    });

    el.innerHTML = '<table class="gantt-table"><thead><tr>' + hdr + '</tr></thead><tbody>' + rows + '</tbody></table>';
    el.querySelectorAll('.bar').forEach(b => b.addEventListener('mousedown', onDragStart));
  }

  function renderMulti() {
    const el = $('viewMulti');
    if (!projects.length) {
      el.innerHTML = '<div class="proj-card" style="grid-column:1/-1"><div class="proj-empty">暂无项目 · 请先新建或加载示例</div></div>';
      return;
    }
    el.innerHTML = projects.map((proj, pi) => {
      const pt = getProjectTasks(proj.id);
      const c = projColor(pi);
      if (!pt.length) {
        return '<div class="proj-card"><div class="proj-card-head"><h2><span class="project-tag" style="background:' + c + '"></span>' + proj.name + '</h2><span class="badge">0 任务</span></div><div class="proj-empty">暂无任务</div></div>';
      }
      const range = getGlobalRange(tasks);
      const days = diffDays(range.start, range.end) + 1;
      const tdIdx = diffDays(range.start, today());
      const showDays = Math.min(days, 14);
      let hdr = '<th></th>';
      for (let i = 0; i < showDays; i++) {
        const d = addDays(range.start, i);
        hdr += '<th>' + (d.getMonth() + 1) + '/' + d.getDate() + '</th>';
      }
      let body = '';
      pt.forEach(tk => {
        const ts = parseDate(tk.start), te = parseDate(tk.end);
        const si = diffDays(range.start, ts), span = diffDays(ts, te) + 1;
        const bc = barClass(tk);
        const bg = barColor(bc);
        body += '<tr><td title="' + tk.name + '">' + tk.name + '</td>';
        for (let i = 0; i < showDays; i++) {
          let inner = '';
          if (i >= si && i < si + span) {
            const isStart = i === si;
            const w = isStart ? Math.min(span, showDays - i) * MINI_W - 2 : 0;
            if (isStart) inner = '<div class="mini-bar" style="width:' + w + 'px;background:' + bg + '"></div>';
            else inner = '<div class="mini-bar" style="left:0;width:100%;background:' + bg + '"></div>';
          }
          body += '<td class="mini-cell' + (i === tdIdx ? ' today' : '') + '">' + inner + '</td>';
        }
        body += '</tr>';
      });
      const doing = pt.filter(t => t.status === 'doing').length;
      const done = pt.filter(t => t.status === 'done').length;
      return '<div class="proj-card"><div class="proj-card-head"><h2><span class="project-tag" style="background:' + c + '"></span>' + proj.name + '</h2><span class="badge">' + pt.length + ' 任务 · ' + doing + ' 进行 · ' + done + ' 完成</span></div><div class="proj-card-body"><table class="mini-table"><thead><tr>' + hdr + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
    }).join('');
  }

  function render() {
    updateStats();
    refreshProjectSelect();
    renderSingle();
    renderMulti();
  }

  function switchView(v) {
    view = v;
    $('tabSingle').classList.toggle('active', v === 'single');
    $('tabMulti').classList.toggle('active', v === 'multi');
    $('viewSingle').classList.toggle('hide', v !== 'single');
    $('viewMulti').classList.toggle('hide', v !== 'multi');
    setStatus(v === 'single' ? '单项目视图 · 按项目分组展示全部任务' : '多项目并排 · 共 ' + projects.length + ' 个项目横向对比');
  }

  function onDragStart(e) {
    e.preventDefault();
    const id = e.currentTarget.dataset.id;
    const tk = tasks.find(t => t.id === id);
    if (!tk) return;
    drag = { id, startX: e.clientX, origStart: tk.start, origEnd: tk.end };
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    setStatus('拖拽中 · 「' + tk.name + '」');
  }
  function onDragMove(e) {
    if (!drag) return;
    const delta = Math.round((e.clientX - drag.startX) / DAY_W);
    if (!delta) return;
    const tk = tasks.find(t => t.id === drag.id);
    const os = parseDate(drag.origStart), oe = parseDate(drag.origEnd);
    const span = diffDays(os, oe);
    const ns = addDays(os, delta);
    tk.start = fmtDate(ns);
    tk.end = fmtDate(addDays(ns, span));
    render();
  }
  function onDragEnd() {
    if (drag) {
      const tk = tasks.find(t => t.id === drag.id);
      setStatus('已更新 · 「' + tk.name + '」' + tk.start + ' ~ ' + tk.end);
      drag = null;
    }
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
  }

  window.cycleStatus = function (idx) {
    const order = ['todo', 'doing', 'done'];
    tasks[idx].status = order[(order.indexOf(tasks[idx].status) + 1) % 3];
    setStatus('「' + tasks[idx].name + '」→ ' + { todo: '未开始', doing: '进行中', done: '已完成' }[tasks[idx].status]);
    render();
  };
  window.removeTask = function (idx) {
    const n = tasks[idx].name;
    tasks.splice(idx, 1);
    setStatus('已删除「' + n + '」');
    render();
  };
  window.delProject = function (id) {
    const p = projects.find(x => x.id === id);
    tasks = tasks.filter(t => t.projectId !== id);
    projects = projects.filter(x => x.id !== id);
    setStatus('已删除项目「' + p.name + '」及其任务');
    render();
  };

  $('addProjBtn').onclick = function () {
    const name = $('projName').value.trim();
    if (!name) { showError('请输入项目名称'); return; }
    projects.push({ id: 'p' + Date.now(), name });
    $('projName').value = '';
    setStatus('已创建项目「' + name + '」，当前 ' + projects.length + ' 个');
    render();
  };

  $('addTaskBtn').onclick = function () {
    const pid = $('taskProject').value;
    const name = $('taskName').value.trim();
    const start = $('startDate').value, end = $('endDate').value;
    if (!pid) { showError('请先创建项目'); return; }
    if (!name) { showError('请输入任务名称'); return; }
    if (!start || !end) { showError('请选择日期'); return; }
    if (parseDate(end) < parseDate(start)) { showError('结束不能早于开始'); return; }
    tasks.push({ id: 't' + Date.now(), projectId: pid, name, start, end, status: $('taskStatus').value });
    $('taskName').value = '';
    const pn = projects.find(p => p.id === pid).name;
    setStatus('已在「' + pn + '」添加「' + name + '」');
    render();
  };

  $('demoBtn').onclick = function () {
    const t = today();
    projects = [
      { id: 'p1', name: '移动端 2.0' },
      { id: 'p2', name: '后台重构' },
      { id: 'p3', name: '数据大屏' },
    ];
    tasks = [
      { id: 't1', projectId: 'p1', name: 'UI 设计', start: fmtDate(addDays(t, -3)), end: fmtDate(addDays(t, 2)), status: 'doing' },
      { id: 't2', projectId: 'p1', name: '前端开发', start: fmtDate(addDays(t, 1)), end: fmtDate(addDays(t, 10)), status: 'todo' },
      { id: 't3', projectId: 'p1', name: '提测', start: fmtDate(addDays(t, 9)), end: fmtDate(addDays(t, 12)), status: 'todo' },
      { id: 't4', projectId: 'p2', name: '架构评审', start: fmtDate(addDays(t, -5)), end: fmtDate(addDays(t, -2)), status: 'done' },
      { id: 't5', projectId: 'p2', name: 'API 改造', start: fmtDate(addDays(t, -1)), end: fmtDate(addDays(t, 8)), status: 'doing' },
      { id: 't6', projectId: 'p2', name: '迁移验证', start: fmtDate(addDays(t, 7)), end: fmtDate(addDays(t, 14)), status: 'todo' },
      { id: 't7', projectId: 'p3', name: '需求确认', start: fmtDate(addDays(t, -2)), end: fmtDate(t), status: 'done' },
      { id: 't8', projectId: 'p3', name: '图表组件', start: fmtDate(addDays(t, 1)), end: fmtDate(addDays(t, 9)), status: 'doing' },
      { id: 't9', projectId: 'p3', name: '联调上线', start: fmtDate(addDays(t, 8)), end: fmtDate(addDays(t, 15)), status: 'todo' },
    ];
    setStatus('已加载 3 个项目 · 9 条任务 · 可切换「多项目并排」查看');
    render();
  };

  $('tabSingle').onclick = () => switchView('single');
  $('tabMulti').onclick = () => switchView('multi');

  const t = today();
  $('startDate').value = fmtDate(t);
  $('endDate').value = fmtDate(addDays(t, 4));
  render();
})();
</script>
</body>
</html>
