<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目排期甘特图 · 多项目并排</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>项目排期甘特图</h1>
      <p>单项目明细 · 多项目并排对比，一眼看清各线进度</p>
    </div>
    <div class="view-tabs">
      <button id="tabSingle" class="active">单项目视图</button>
      <button id="tabMulti">多项目并排</button>
    </div>
  </header>

  <div class="summary">
    <div class="card"><div class="num" id="statProjects">0</div><div class="lbl">项目数</div></div>
    <div class="card"><div class="num" id="statTotal">0</div><div class="lbl">总任务</div></div>
    <div class="card"><div class="num" id="statDoing">0</div><div class="lbl">进行中</div></div>
    <div class="card"><div class="num" id="statOverdue">0</div><div class="lbl">已逾期</div></div>
  </div>

  <div class="toolbar">
    <div class="field name"><label>项目名称</label><input type="text" id="projName" placeholder="例如：移动端 2.0" maxlength="20"></div>
    <button class="btn btn-ghost" id="addProjBtn">新建项目</button>
    <div class="toolbar-divider"></div>
    <div class="field"><label>所属项目</label><select id="taskProject"></select></div>
    <div class="field name"><label>任务名称</label><input type="text" id="taskName" placeholder="例如：接口联调" maxlength="30"></div>
    <div class="field date"><label>开始</label><input type="date" id="startDate"></div>
    <div class="field date"><label>结束</label><input type="date" id="endDate"></div>
    <div class="field"><label>状态</label>
      <select id="taskStatus"><option value="todo">未开始</option><option value="doing" selected>进行中</option><option value="done">已完成</option></select>
    </div>
    <button class="btn btn-primary" id="addTaskBtn">添加任务</button>
    <button class="btn btn-ghost" id="demoBtn">加载示例</button>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="status-bar" id="statusBar">就绪 · 先建项目再加任务，或点「加载示例」</div>

  <div class="legend">
    <span><i class="dot" style="background:#94a3b8"></i>未开始</span>
    <span><i class="dot" style="background:#2563eb"></i>进行中</span>
    <span><i class="dot" style="background:#059669"></i>已完成</span>
    <span><i class="dot" style="background:#dc2626"></i>已逾期</span>
    <span><i class="dot-line"></i>今天</span>
  </div>

  <div id="viewSingle" class="panel">
    <div class="panel-scroll"><div id="singleContent"><div class="empty"><div class="empty-icon">📅</div><p>暂无数据</p><small>新建项目并添加任务，或加载示例</small></div></div></div>
  </div>

  <div id="viewMulti" class="multi-grid hide"></div>
</div>

<script src="app.js" defer></script>
</body>
</html>
